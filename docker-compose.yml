services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto_news_rag
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_news_rag"]
      interval: 5s
      retries: 10

  init:                      # creates tables once, then exits
    build: .
    env_file: .env.docker
    command: python -c "from etl.database import init_db; init_db()"
    depends_on:
      db: {condition: service_healthy}

  etl:                       # hourly ETL + index rebuild
    build: .
    env_file: .env.docker
    command: python -m etl.scheduler
    restart: unless-stopped
    volumes: [faiss:/app/data, hf_cache:/root/.cache/huggingface]
    depends_on:
      init: {condition: service_completed_successfully}

  app:                       # Streamlit UI
    build: .
    env_file: .env.docker
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports: ["8501:8501"]
    volumes: [faiss:/app/data, hf_cache:/root/.cache/huggingface]
    depends_on:
      init: {condition: service_completed_successfully}

volumes:
  pgdata:
  faiss:
  hf_cache:
